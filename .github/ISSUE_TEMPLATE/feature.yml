name: 기능 요청
description: 새 API나 기능
title: '[Feat] '
labels: ['feature']
body:
  - type: dropdown
    id: role
    attributes:
      label: 대상 역할
      description: 이 기능의 데이터를 보고 판단하는 사람
      multiple: true
      options:
        - 콘텐츠/시스템 기획
        - 레벨 디자인
        - 엔지니어
        - 라이브 운영
        - 팀 내부 (개발 편의)
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 목적
      description: 이 역할이 이 API로 받은 데이터로 무엇을 판단하고 무엇을 고칠 수 있게 되는가. 한두 문장
      placeholder: 레벨 디자이너가 몬스터별 교전·사망 수를 받아 기대보다 위험한 몬스터를 찾는다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 내용
      description: 만들 것을 항목으로
      placeholder: |
        - encounters 모듈 추가
        - GET /encounters/summary 엔드포인트
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 리뷰어가 직접 확인할 수 있는 체크리스트
      placeholder: |
        - [ ] 운영자 계정이 제외된 수치를 돌려준다
        - [ ] 응답에 지갑 주소 필드가 없다
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: 범위 밖
      description: 이번 이슈에서 하지 않는 것
  - type: textarea
    id: ref
    attributes:
      label: 참고 자료
      description: 계산 정의, 데이터 파일, 관련 이슈 (#번호)
